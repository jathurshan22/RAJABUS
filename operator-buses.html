<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>My Buses | RajaBus</title>

  <link
    rel="stylesheet"
    href="operator-buses.css"
  >

  <link
    rel="stylesheet"
    href="toast.css"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

</head>


<body>

<div
  id="toastContainer"
  class="toast-container"
></div>


<div class="layout">


  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="logo">
      Raja<span>Bus</span>
    </div>

    <p class="portal">
      Operator Portal
    </p>


    <nav>

      <a href="operator-dashboard.html">
        <i class="fa-solid fa-chart-line"></i>
        Dashboard
      </a>

      <a
        href="operator-buses.html"
        class="active"
      >
        <i class="fa-solid fa-bus"></i>
        My Buses
      </a>

      <a href="operator-trips.html">
        <i class="fa-solid fa-route"></i>
        Trips
      </a>

      <a href="operator-bookings.html">
        <i class="fa-solid fa-ticket"></i>
        Bookings
      </a>

      <a href="operator-profile.html">
        <i class="fa-solid fa-user"></i>
        Profile
      </a>

    </nav>


    <button
      id="logoutBtn"
      class="logout-btn"
    >
      <i class="fa-solid fa-right-from-bracket"></i>
      Logout
    </button>

  </aside>



  <!-- MAIN -->

  <main class="main">


    <header class="page-header">

      <div>

        <p>
          Operator Management
        </p>

        <h1>My Buses</h1>

      </div>


      <button
        id="openAddBusBtn"
        class="primary-btn"
      >
        <i class="fa-solid fa-plus"></i>
        Add New Bus
      </button>

    </header>



    <!-- SUMMARY -->

    <section class="summary-card">

      <div class="summary-icon">

        <i class="fa-solid fa-bus"></i>

      </div>


      <div>

        <p>
          Total Buses
        </p>

        <h2 id="busCount">
          0
        </h2>

      </div>

    </section>



    <!-- BUS LIST -->

    <section class="content-card">

      <div class="content-header">

        <div>

          <h2>
            Registered Buses
          </h2>

          <p>
            Manage buses belonging to your company.
          </p>

        </div>

      </div>


      <div
        id="busContainer"
        class="bus-grid"
      >

        <div class="loading">
          Loading buses...
        </div>

      </div>

    </section>

  </main>

</div>



<!-- =====================================
     ADD / EDIT MODAL
     ===================================== -->

<div
  id="busModal"
  class="modal"
>

  <div class="modal-card">


    <div class="modal-header">

      <div>

        <p>
          Bus Management
        </p>

        <h2 id="modalTitle">
          Add New Bus
        </h2>

      </div>


      <button
        id="closeModalBtn"
        class="close-btn"
        type="button"
      >

        <i class="fa-solid fa-xmark"></i>

      </button>

    </div>



    <form id="busForm">


      <input
        type="hidden"
        id="editBusId"
      >


      <div class="form-grid">


        <div class="input-group">

          <label>
            Bus Number
          </label>

          <input
            id="busNo"
            type="text"
            placeholder="RB-001"
            required
          >

        </div>


        <div class="input-group">

          <label>
            Registration Number
          </label>

          <input
            id="regNo"
            type="text"
            placeholder="NC-1234"
            required
          >

        </div>


        <div class="input-group">

          <label>From</label>

          <input
            id="from"
            type="text"
            placeholder="Mihintale"
            required
          >

        </div>


        <div class="input-group">

          <label>To</label>

          <input
            id="to"
            type="text"
            placeholder="Colombo"
            required
          >

        </div>


        <div class="input-group">

          <label>Bus Type</label>

         <select id="type" required>
            <option value="">Select type</option>
            <option value="Private">Private</option>
            <option value="CTB">CTB</option>
         </select>
        </div>


        <div class="input-group">

          <label>
            Distance (KM)
          </label>

          <input
            id="distanceKm"
            type="number"
            min="0"
            placeholder="200"
          >

        </div>


        <div class="input-group">

          <label>
            Departure Time
          </label>

          <input
            id="depart"
            type="time"
            required
          >

        </div>


        <div class="input-group">

          <label>
            Arrival Time
          </label>

          <input
            id="arrive"
            type="time"
            required
          >

        </div>


        <div class="input-group">

          <label>
            Minimum Fare
          </label>

          <input
            id="fareMin"
            type="number"
            min="0"
            placeholder="500"
          >

        </div>


        <div class="input-group">

          <label>
            Maximum Fare
          </label>

          <input
            id="fareMax"
            type="number"
            min="0"
            placeholder="1500"
          >

        </div>

      </div>


      <div class="modal-actions">

        <button
          id="cancelBtn"
          type="button"
          class="secondary-btn"
        >
          Cancel
        </button>


        <button
          id="saveBusBtn"
          type="submit"
          class="primary-btn"
        >

          <i class="fa-solid fa-floppy-disk"></i>

          Save Bus

        </button>

      </div>

    </form>

  </div>

</div>


<script src="toast.js"></script>
<script src="operator-buses.js"></script>

</body>

</html>

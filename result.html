<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Search Results - Raja Bus
  </title>


  <!-- Main Result CSS -->
  <link
    rel="stylesheet"
    href="result.css"
  >

  <!-- Toast -->
  <link
    rel="stylesheet"
    href="toast.css"
  >

  <!-- Global CSS -->
  <link
    rel="stylesheet"
    href="globals.css"
  >

  <!-- Theme -->
  <link
    rel="stylesheet"
    href="theme.css"
  >


  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  >


  <!-- Google Font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >


  <!-- Flatpickr -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"
  >

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/material_orange.css"
  >


  <!-- Responsive Dark CSS -->
  <link
    rel="stylesheet"
    href="dark-responsive.css"
  >
</head>


<body>

  <!-- ==================================================
       LOGO
       ================================================== -->

  <div class="image">
    <img
      class="crest"
      id="home"
      src="images/rajalogo.png"
      alt="Raja Bus Logo"
    >
  </div>


  <div class="top-border"></div>


  <div class="container">


    <!-- ==================================================
         NAVBAR
         ================================================== -->

    <div class="navbar">

      <div class="logo">
        RAJA <span>BUS.</span>
      </div>


      <div class="nav-links">

        <a
          href="home.html"
          class="active"
        >
          Home
        </a>

        <a href="home.html#about">
          About
        </a>

        <a href="review.html">
          Review
        </a>

        <a href="contact.html">
          Contact
        </a>

        <a href="booking-history.html">
          Journey
        </a>

      </div>


      <div class="nav-right">

        <button
          id="themeToggle"
          type="button"
          class="theme-toggle"
          aria-label="Toggle dark mode"
        >

          <i
            class="fa-solid fa-moon"
            aria-hidden="true"
          ></i>

        </button>


        <div class="hotline">

          HOT LINE

          <span>
            1824
          </span>

        </div>


        <a
          href="login.html"
          class="profile-btn"
          id="profileBtn"
          aria-label="Profile or login"
        >

          <img
            id="homeProfilePhoto"
            src=""
            alt="Profile"
            style="display:none;"
          >


          <i
            class="fa-solid fa-user"
            id="defaultIcon"
            aria-hidden="true"
          ></i>

        </a>

      </div>

    </div>


    <!-- ==================================================
         HEADER
         ================================================== -->

    <header class="result-header">
    </header>


    <!-- ==================================================
         HERO
         ================================================== -->

    <section class="hero">

      <h1>
        Available Buses
      </h1>


      <p>
        Choose your best route and book your seat easily.
      </p>


      <div class="search-summary">

        <!-- FROM -->

        <div>

          <i
            class="fa-solid fa-location-dot"
          ></i>

          <span>
            From
          </span>

          <b>
            Mihintale
          </b>

        </div>


        <!-- TO -->

        <div>

          <i
            class="fa-solid fa-map-location-dot"
          ></i>

          <span>
            To
          </span>

          <b id="districtName">
            -
          </b>

        </div>


        <!-- DATE -->

        <div>

          <i
            class="fa-solid fa-calendar-days"
          ></i>

          <span>
            Date
          </span>

          <b id="travelDate">
            -
          </b>

        </div>


        <!-- BUS TYPE -->

        <div>

          <i
            class="fa-solid fa-bus"
          ></i>

          <span>
            Bus Type
          </span>

          <b id="busType">
            Any
          </b>

        </div>

      </div>

    </section>


    <!-- ==================================================
         BUS RESULTS
         ================================================== -->

    <section
      class="results-section"
      id="resultsSection"
    >

      <p id="resultsStatus">
        Loading buses...
      </p>

    </section>


    <!-- ==================================================
         SEAT SELECTION MODAL
         ================================================== -->

    <div
      class="seat-modal"
      id="seatModal"
    >

      <div class="sl-seat-box">


        <!-- CLOSE -->

        <button
          class="close-seat"
          id="closeSeat"
          type="button"
          aria-label="Close seat selection"
        >
          ×
        </button>


        <!-- ==================================================
             SEAT LEGEND
             ================================================== -->

        <div class="legend-row">
          <span><i class="lg available"></i> Available</span>
          <span><i class="lg processing"></i> Selected</span>
          <span><i class="lg counter"></i> Counter Seat</span>
          <span><i class="lg booked"></i> Booked</span>
        </div>


        <!-- ==================================================
             BUS SEAT AREA
             ================================================== -->

        <div class="bus-area">

          <div
            class="seat-map"
            id="busLayout"
          >
          </div>

        </div>


        <!-- ==================================================
             PROCEED
             ================================================== -->

        <button
          class="proceed-btn"
          id="proceedBtn"
          type="button"
        >
          Proceed
        </button>


        <div class="footer-actions">
        </div>


        <!-- ==================================================
             BOOKING SUMMARY
             ================================================== -->

        <div class="bottom-bar">


          <!-- SEAT -->

          <div class="info-item">

            <span>
              Seat No
            </span>

            <b id="selectedSeats">
              00
            </b>

          </div>


          <!-- BOARDING -->

          <div class="info-item">

            <span>
              Boarding
            </span>

            <b id="modalBoarding">
              Mihintale
            </b>

          </div>


          <!-- DROPPING -->

          <div class="info-item">

            <span>
              Dropping
            </span>

            <b id="modalDropping">
              -
            </b>

          </div>


          <!-- FARE -->

          <div class="info-item fare">

            <span>
              Total Fare
            </span>

            <b>
              Rs.
              <span id="totalFare">
                00
              </span>
            </b>

          </div>

        </div>


      </div>

    </div>

  </div>


  <!-- ==================================================
       JAVASCRIPT
       ================================================== -->

  <script src="toast.js"></script>

  <script src="seat.js"></script>

  <script src="result.js"></script>

  <script src="navbar-profile.js?v=50"></script>

  <script src="theme.js"></script>

</body>

</html>

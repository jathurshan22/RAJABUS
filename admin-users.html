<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Raja Bus - Manage Users</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" href="admin-common.css">

<style>
.stats-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:25px;
}

.stat-card{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.06);
    display:flex;
    align-items:center;
    gap:15px;
}

.stat-card i{
    width:60px;
    height:60px;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:22px;
}

.bg-blue{background:#3b82f6;}
.bg-green{background:#22c55e;}
.bg-purple{background:#8b5cf6;}

.stat-card h2{font-size:28px;}
.stat-card p{color:#64748b;}

.table-header input{
    width:320px;
}
</style>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="dark-responsive.css">
</head>

<body>

<div class="dashboard">

    <aside class="sidebar">
        <div>
            <div class="logo">
                <i class="fa-solid fa-bus"></i>
                <span>Raja Bus</span>
            </div>

            <ul class="menu">
                <li><a href="admin-dashboard.html"><i class="fa-solid fa-chart-line"></i>Dashboard</a></li>
                <li><a href="admin-buses.html"><i class="fa-solid fa-bus"></i>Buses</a></li>
                <li><a href="admin-bookings.html"><i class="fa-solid fa-ticket"></i>Bookings</a></li>
                <li class="active"><a href="admin-users.html"><i class="fa-solid fa-users"></i>Users</a></li>
                <li><a href="admin-messages.html"><i class="fa-solid fa-envelope"></i>Messages</a></li>
            </ul>
        </div>

        
    </aside>

    <main class="main-content">

     <div class="topbar">
    <div>
        <h1>Manage Buses</h1>
        <p>Manage routes and schedules</p>
    </div>

    <button class="primary-btn"
    onclick="window.location.href='admin-dashboard.html'">
        Dashboard
    </button>
</div>
        <div class="stats-grid">

            <div class="stat-card">
                <i class="fa-solid fa-users bg-blue"></i>
                <div>
                    <h2 id="totalUsers">0</h2>
                    <p>Total Users</p>
                </div>
            </div>

            <div class="stat-card">
                <i class="fa-solid fa-user-check bg-green"></i>
                <div>
                    <h2 id="activeUsers">0</h2>
                    <p>Active Users</p>
                </div>
            </div>

            <div class="stat-card">
                <i class="fa-solid fa-ticket bg-purple"></i>
                <div>
                    <h2 id="totalBookings">0</h2>
                    <p>User Bookings</p>
                </div>
            </div>

        </div>

        <div class="table-card">
            <div class="table-header">
                <h2>Registered Users</h2>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search name, email, phone..."
                >
            </div>

            <table>
                <thead>
                    <tr>
                        <th>User ID</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Joined Date</th>
                        <th>Total Bookings</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="userTable"></tbody>
            </table>
        </div>

    </main>

</div>

<script src="admin-auth.js"></script>
<script src="admin-users.js"></script>

<script src="theme.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - Raja Bus</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin-login.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="dark-responsive.css">
</head>

<body>

<div class="bg-circle circle-one"></div>
<div class="bg-circle circle-two"></div>

<section class="login-wrapper">

    <div class="brand-panel">
        <div class="brand-badge">RB</div>
        <h1>Raja Bus</h1>
        <p>Admin control center for routes, bookings, users and revenue.</p>

        <div class="mini-stats">
            <div>
                <strong>25+</strong>
                <span>Districts</span>
            </div>
            <div>
                <strong>24/7</strong>
                <span>Booking</span>
            </div>
        </div>
    </div>

    <div class="login-panel">
        <h2>Welcome Back</h2>
        <p class="sub-text">Login to manage Raja Bus system</p>

        <form id="adminLoginForm">
            <div class="input-box">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="admin@rajabus.com" required>
            </div>

            <div class="input-box">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>

            <button type="submit" id="loginBtn">Sign In</button>
        </form>

        <p class="hint">Demo: admin@rajabus.com / admin123</p>
    </div>

</section>

<script src="admin-login.js"></script>
<script src="theme.js"></script>
</body>
</html>

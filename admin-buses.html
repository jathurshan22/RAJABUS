<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Raja Bus - Manage Buses</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" href="admin-common.css">

<style>

.stats-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:25px;
}

.stat-card{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.06);
    display:flex;
    align-items:center;
    gap:15px;
}

.stat-card i{
    width:60px;
    height:60px;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:22px;
}

.bg-orange{background:#f97316;}
.bg-blue{background:#3b82f6;}
.bg-green{background:#22c55e;}
.bg-purple{background:#8b5cf6;}

.stat-card h2{
    font-size:28px;
}

.stat-card p{
    color:#64748b;
}

.search-filter{
    display:flex;
    gap:15px;
}

.search-filter input,
.search-filter select{
    width:220px;
}

</style>

  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="dark-responsive.css">
</head>

<body>

<div class="dashboard">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div>

            <div class="logo">
                <i class="fa-solid fa-bus"></i>
                <span>Raja Bus</span>
            </div>

            <ul class="menu">

                <li>
                    <a href="admin-dashboard.html">
                        <i class="fa-solid fa-chart-line"></i>
                        Dashboard
                    </a>
                </li>

                <li class="active">
                    <a href="admin-buses.html">
                        <i class="fa-solid fa-bus"></i>
                        Buses
                    </a>
                </li>

                <li>
                    <a href="admin-bookings.html">
                        <i class="fa-solid fa-ticket"></i>
                        Bookings
                    </a>
                </li>

                <li>
                    <a href="admin-users.html">
                        <i class="fa-solid fa-users"></i>
                        Users
                    </a>
                </li>

                <li>
                    <a href="admin-messages.html">
                        <i class="fa-solid fa-envelope"></i>
                        Messages
                    </a>
                </li>

            </ul>

        </div>

     

    </aside>

    <!-- MAIN -->

    <main class="main-content">

        <div class="topbar">
    <div>
        <h1>Manage Buses</h1>
        <p>Manage routes and schedules</p>
    </div>

    <button class="primary-btn"
    onclick="window.location.href='admin-dashboard.html'">
        Dashboard
    </button>
</div>


        <!-- STATS -->

        <div class="stats-grid">

            <div class="stat-card">
                <i class="fa-solid fa-bus bg-orange"></i>
                <div>
                    <h2 id="busCount">0</h2>
                    <p>Total Buses</p>
                </div>
            </div>

            <div class="stat-card">
                <i class="fa-solid fa-route bg-blue"></i>
                <div>
                    <h2 id="routeCount">0</h2>
                    <p>Routes</p>
                </div>
            </div>

            <div class="stat-card">
                <i class="fa-solid fa-location-dot bg-green"></i>
                <div>
                    <h2 id="destinationCount">0</h2>
                    <p>Destinations</p>
                </div>
            </div>

            <div class="stat-card">
                <i class="fa-solid fa-money-bill bg-purple"></i>
                <div>
                    <h2 id="fareAvg">0</h2>
                    <p>Average Fare</p>
                </div>
            </div>

        </div>

        <!-- FORM -->

        <div class="form-card">

            <h2>Add / Update Bus</h2>

            <form id="busForm">

                <div class="form-grid">

                    <input id="from" placeholder="From" required>
                    <input id="to" placeholder="To" required>

                    <input id="date" type="date" required>

                    <select id="type">
                        <option value="">Bus Type</option>
                        <option value="CTB">CTB</option>
                        <option value="Private">Private</option>
                    </select>

                    <input id="depart" type="time" required>
                    <input id="arrive" type="time" required>

                    <input id="bus_no" placeholder="Bus Number" required>

                    <input id="distance_km"
                    type="number"
                    placeholder="Distance KM"
                    required>

                    <input id="fare_min"
                    type="number"
                    placeholder="Minimum Fare"
                    required>

                    <input id="fare_max"
                    type="number"
                    placeholder="Maximum Fare"
                    required>

                    <input id="total_seats"
                    type="number"
                    placeholder="Total Seats"
                    min="1"
                    value="40">

                </div>

                <button
                id="saveBtn"
                class="primary-btn"
                type="submit">
                Save Bus
                </button>

            </form>

        </div>

        <!-- TABLE -->

        <div class="table-card">

            <div class="table-header">

                <h2>All Buses</h2>

                <div class="search-filter">

                    <input
                    type="text"
                    id="searchInput"
                    placeholder="Search Bus">

                    <select id="typeFilter">
                        <option value="">All Types</option>
                        <option value="CTB">CTB</option>
                        <option value="Private">Private</option>
                    </select>

                </div>

            </div>

            <table>

                <thead>

                    <tr>
                        <th>Bus No</th>
                        <th>Route</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Type</th>
                        <th>Fare</th>
                        <th>Seats</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody id="busTable">

                </tbody>

            </table>

        </div>

    </main>

</div>

<script src="admin-auth.js"></script>
<script src="admin-buses.js"></script>

<script src="theme.js"></script>
</body>
</html>

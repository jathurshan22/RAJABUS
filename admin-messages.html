<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Raja Bus - Messages</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="admin-common.css">

<style>
.stats-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:25px;
}

.stat-card{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.06);
    display:flex;
    align-items:center;
    gap:15px;
}

.stat-card i{
    width:60px;
    height:60px;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:22px;
}

.bg-orange{background:#f97316;}
.bg-red{background:#ef4444;}
.bg-green{background:#22c55e;}

.stat-card h2{font-size:28px;}
.stat-card p{color:#64748b;}

.table-header input{
    width:320px;
}

.message-text{
    max-width:260px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
</style>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="dark-responsive.css">
</head>

<body>

<div class="dashboard">

    <aside class="sidebar">
        <div>
            <div class="logo">
                <i class="fa-solid fa-bus"></i>
                <span>Raja Bus</span>
            </div>

            <ul class="menu">
                <li><a href="admin-dashboard.html"><i class="fa-solid fa-chart-line"></i>Dashboard</a></li>
                <li><a href="admin-buses.html"><i class="fa-solid fa-bus"></i>Buses</a></li>
                <li><a href="admin-bookings.html"><i class="fa-solid fa-ticket"></i>Bookings</a></li>
                <li><a href="admin-users.html"><i class="fa-solid fa-users"></i>Users</a></li>
                <li class="active"><a href="admin-messages.html"><i class="fa-solid fa-envelope"></i>Messages</a></li>
            </ul>
        </div>

        
    </aside>

    <main class="main-content">

        <div class="topbar">
    <div>
        <h1>Manage Buses</h1>
        <p>Manage routes and schedules</p>
    </div>

    <button class="primary-btn"
    onclick="window.location.href='admin-dashboard.html'">
        Dashboard
    </button>
</div>

        <div class="stats-grid">

            <div class="stat-card">
                <i class="fa-solid fa-envelope bg-orange"></i>
                <div>
                    <h2 id="totalMessages">0</h2>
                    <p>Total Messages</p>
                </div>
            </div>

            <div class="stat-card">
                <i class="fa-solid fa-envelope-open-text bg-red"></i>
                <div>
                    <h2 id="unreadMessages">0</h2>
                    <p>Unread</p>
                </div>
            </div>

            <div class="stat-card">
                <i class="fa-solid fa-circle-check bg-green"></i>
                <div>
                    <h2 id="readMessages">0</h2>
                    <p>Read</p>
                </div>
            </div>

        </div>

        <div class="table-card">

            <div class="table-header">
                <h2>All Messages</h2>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search name, email, subject..."
                >
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Message ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Subject</th>
                        <th>Message</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="messageTable"></tbody>
            </table>

        </div>

    </main>

</div>

<script src="admin-auth.js"></script>
<script src="admin-messages.js"></script>

<script src="theme.js"></script>
</body>
</html>

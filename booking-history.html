<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Journey History - Raja Bus
  </title>


  <link
    rel="stylesheet"
    href="booking-history.css"
  >

  <link
    rel="stylesheet"
    href="toast.css"
  >

  <link
    rel="stylesheet"
    href="globals.css"
  >

  <link
    rel="stylesheet"
    href="theme.css"
  >


  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  >


  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >


  <link
    rel="stylesheet"
    href="dark-responsive.css"
  >
</head>


<body>

  <!-- ================================================
       LOGO
       ================================================ -->

  <div class="image">

    <img
      class="crest"
      id="home"
      src="images/rajalogo.png"
      alt="Raja Bus Logo"
    >

  </div>


  <div class="top-border"></div>


  <div class="container">


    <!-- ================================================
         NAVBAR
         ================================================ -->

    <div class="navbar">

      <div
        id="backdrop"
        class="nav-backdrop"
        hidden
      ></div>


      <div class="logo">
        RAJA <span>BUS.</span>
      </div>


      <div class="nav-links">

        <a href="home.html">
          Home
        </a>

        <a href="home.html#about">
          About
        </a>

        <a href="review.html">
          Review
        </a>

        <a href="contact.html">
          Contact
        </a>

        <a
          href="booking-history.html"
          class="active"
        >
          Journey
        </a>

      </div>


      <div class="nav-right">

        <button
          id="themeToggle"
          type="button"
          class="theme-toggle"
          aria-label="Toggle dark mode"
        >

          <i
            class="fa-solid fa-moon"
            aria-hidden="true"
          ></i>

        </button>


        <a
          href="login.html"
          class="profile-btn"
          id="profileBtn"
          aria-label="Profile or login"
        >

          <img
            id="homeProfilePhoto"
            src=""
            alt="Profile"
            style="display:none;"
          >

          <i
            class="fa-solid fa-user"
            id="defaultIcon"
            aria-hidden="true"
          ></i>

        </a>

      </div>

    </div>


    <!-- ================================================
         JOURNEY HISTORY PAGE
         ================================================ -->

    <main class="journey-page">


      <!-- ==============================================
           HERO
           ============================================== -->

      <section class="clean-hero">

        <div class="hero-left">

          <span>
            RAJA BUS
          </span>

          <h1>
            Journey History
          </h1>

          <p>
            View your confirmed tickets and booking records in one place.
          </p>

        </div>


        <a
          href="home.html"
          class="new-trip-btn"
        >

          <i
            class="fa-solid fa-plus"
          ></i>

          New Trip

        </a>

      </section>


      <!-- ==============================================
           STATISTICS
           ============================================== -->

      <section class="stats-grid">


        <!-- TOTAL CONFIRMED TRIPS -->

        <div class="stat-card">

          <i
            class="fa-solid fa-route"
          ></i>

          <h2 id="totalTrips">
            0
          </h2>

          <p>
            Confirmed Trips
          </p>

        </div>


        <!-- TOTAL SPENT -->

        <div class="stat-card">

          <i
            class="fa-solid fa-wallet"
          ></i>

          <h2 id="totalSpent">
            Rs. 0
          </h2>

          <p>
            Total Spent
          </p>

        </div>


        <!-- LAST TRIP -->

        <div class="stat-card">

          <i
            class="fa-solid fa-circle-check"
          ></i>

          <h2 id="lastTrip">
            -
          </h2>

          <p>
            Last Confirmed Trip
          </p>

        </div>

      </section>


      <!-- ==============================================
           BOOKING LIST
           ============================================== -->

      <section
        class="ticket-grid"
        id="ticketGrid"
      >

        <div class="history-loading">

          <i
            class="fa-solid fa-spinner fa-spin"
          ></i>

          <p>
            Loading your bookings...
          </p>

        </div>

      </section>

    </main>

  </div>


  <!-- ================================================
       JAVASCRIPT
       ================================================ -->

  <script src="toast.js"></script>

  <script src="booking-history.js"></script>

  <script src="navbar-profile.js?v=50"></script>

  <script src="theme.js"></script>

</body>

</html>
